<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/a-icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0 minimum-scale=1"
    />

    <title>KD Portfolio</title>

    <!--
      Microsoft Clarity analytics.
      Loads only when VITE_CLARITY_ID is set at build time, so local dev and
      preview builds don't pollute the real stats. Vite leaves the %VITE_...%
      placeholder untouched when the variable is missing, hence the "%" check.
    -->
    <script>
      (function (projectId) {
        if (!projectId || projectId.charAt(0) === "%") return;
        (function (c, l, a, r, i, t, y) {
          c[a] =
            c[a] ||
            function () {
              (c[a].q = c[a].q || []).push(arguments);
            };
          t = l.createElement(r);
          t.async = 1;
          t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", projectId);
      })("%VITE_CLARITY_ID%");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
